name: Boomi CI/CD Demo

on:
  push:
    branches:
      - main   # Trigger on push to main branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Java (Boomi SDK requires Java)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Hello World (CI validation)
      - name: Run Hello World
        run: echo "Hello World - GitHub Actions CI/CD for Boomi!"

      # Step 4: Package Boomi Process (example using Boomi AtomSphere API)
      - name: Package Boomi Process
        id: package
        
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_PASSWORD: ${{ secrets.BOOMI_PASSWORD }}
        run: |
    

          RESPONSE=$(curl -s -X POST \
              "https://api.boomi.com/api/rest/v1/${BOOMI_ACCOUNT_ID}/PackagedComponent" \
              -u "$BOOMI_USERNAME:$BOOMI_PASSWORD" \
              -H "Content-Type: application/json" \
              -d '{
                "componentId": "d7e24a4e-7271-49ed-ab41-bc738148a3fc",
              "componentVersion":"2",
             "packageVersion":"0.01",
              "notes":"Release package"
                }')

              echo "$RESPONSE"

              PACKAGE_ID=$(echo "$RESPONSE" | sed -n 's:.*<bns:packageId>\(.*\)</bns:packageId>.*:\1:p')

              echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

          - name: Deploy to Dev
               run: |
              curl -X POST \
              "https://api.boomi.com/api/rest/v1/${BOOMI_ACCOUNT_ID}/DeployedPackage" \
               -u "$BOOMI_USERNAME:$BOOMI_PASSWORD" \
                -H "Content-Type: application/json" \
                -d '{
                "packageId":"${{ steps.package.outputs.package_id }}",
                "environmentId":"ed1edd29-64c7-410a-818e-376ca25996bb"
                }'
